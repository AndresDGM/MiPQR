# Configuración de despliegue y desarrollo para el backend de MiPQR (Express + TypeScript + PostgreSQL)
# Todas las variables ${VAR:-default} se leen desde el archivo .env
# o usan su valor por defecto cuando está disponible.

services:
  postgres:
    image: postgres:16-alpine
    container_name: mipqr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-mipqr}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - mipqr-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-mipqr}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - default

  backend:
    build: .
    image: ${IMAGE_AUTOR:+${IMAGE_AUTOR}/}${IMAGE_NAME:-mipqr-backend}:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-mipqr-backend}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-mipqr}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      DES_KEY: ${DES_KEY:-}
      RSA_N: ${RSA_N:-}
      RSA_E: ${RSA_E:-10001}
      RSA_D: ${RSA_D:-}
      STORAGE_PATH: ${STORAGE_PATH:-./uploads/adjuntos}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10}
      MAX_FILES_PER_REQUEST: ${MAX_FILES_PER_REQUEST:-5}
      MAX_TOTAL_SIZE_MB: ${MAX_TOTAL_SIZE_MB:-25}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8000}
      AI_SERVICE_TIMEOUT_MS: ${AI_SERVICE_TIMEOUT_MS:-3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-MiPQR Clinica Dolormed <notificaciones@mipqr.com>}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      APP_URL: ${APP_URL:-http://localhost:4200}
      PQR_SLA_DAYS: ${PQR_SLA_DAYS:-8}
      SLA_ALERT_HOURS_BEFORE: ${SLA_ALERT_HOURS_BEFORE:-48}
      SLA_CHECK_INTERVAL_MINUTES: ${SLA_CHECK_INTERVAL_MINUTES:-60}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-evolution}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://evolution-api:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-mipqr-evolution-key}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE:-mipqr}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-whatsapp:+14155238886}
      TWILIO_CONTENT_SID: ${TWILIO_CONTENT_SID:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v21.0}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-}
      WHATSAPP_TEMPLATE_LANG: ${WHATSAPP_TEMPLATE_LANG:-es}
    volumes:
      - mipqr-uploads:/app/uploads
    networks:
      - default
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik-network}"
      - "traefik.http.routers.${CONTAINER_NAME:-mipqr-backend}.rule=Host(`${DOMAIN:-localhost}`) && PathPrefix(`/${API_PREFIX:-apibackend}`)"
      - "traefik.http.routers.${CONTAINER_NAME:-mipqr-backend}.entrypoints=websecure"
      - "traefik.http.routers.${CONTAINER_NAME:-mipqr-backend}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${CONTAINER_NAME:-mipqr-backend}.middlewares=${CONTAINER_NAME:-mipqr-backend}-strip"
      - "traefik.http.middlewares.${CONTAINER_NAME:-mipqr-backend}-strip.stripprefix.prefixes=/${API_PREFIX:-apibackend}"
      - "traefik.http.services.${CONTAINER_NAME:-mipqr-backend}.loadbalancer.server.port=${PORT:-3000}"

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    image: ${IMAGE_AUTOR:+${IMAGE_AUTOR}/}${IMAGE_NAME:-mipqr-backend}-ai:${IMAGE_TAG:-latest}
    container_name: mipqr-ai-service
    restart: unless-stopped
    ports:
      - '${AI_SERVICE_PORT:-8000}:${AI_SERVICE_PORT:-8000}'
    environment:
      PORT: ${AI_SERVICE_PORT:-8000}
      HOST: 0.0.0.0
      MODEL_PATH: /app/models/modelo.h5
      SCALER_PATH: /app/models/escalador.pkl
      METADATA_PATH: /app/models/metadata.json
    networks:
      - default

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: mipqr-evolution-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${EVOLUTION_PORT:-8080}:8080'
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-mipqr-evolution-key}
      DATABASE_ENABLED: 'true'
      DATABASE_PROVIDER: 'postgresql'
      DATABASE_CONNECTION_URI: 'postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-mipqr}?schema=evolution'
      DATABASE_CONNECTION_CLIENT_NAME: 'evolution'
      CACHE_LOCAL_ENABLED: 'true'
      CACHE_REDIS_ENABLED: 'false'
    volumes:
      - mipqr-evolution-instances:/evolution/instances
    networks:
      - default

volumes:
  mipqr-pgdata:
  mipqr-uploads:
  mipqr-evolution-instances:

networks:
  traefik-net:
    name: ${TRAEFIK_NETWORK:-traefik-network}
    external: true
