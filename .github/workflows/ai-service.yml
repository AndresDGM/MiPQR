name: Publish AI Service

on:
  pull_request:
    branches: ["develop", "main"]
    paths:
      - "ai-service/**"
      - ".github/workflows/ai-service.yml"

  push:
    branches: ["main"]
    paths:
      - "ai-service/**"
      - ".github/workflows/ai-service.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ai-service"
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        working-directory: ./ai-service
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run unit tests
        working-directory: ./ai-service
        run: pytest

  publish:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.actor }}/${{ vars.IMAGE_NAME }}-ai
          tags: |
            type=raw,value=${{ vars.IMAGE_TAG }}
            type=ref,event=tag
            type=sha

      - name: Build and push AI Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./ai-service
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
