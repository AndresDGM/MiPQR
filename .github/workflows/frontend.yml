name: Deploy Angular to GitHub Pages

on:
  pull_request:
    branches: ["develop", "main"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

  push:
    branches: ["main"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Unit Tests
        working-directory: ./frontend
        run: npm test -- --watch=false

  build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 3. Configurar GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 4. Instalar dependencias
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      # 5. Configurar environment.ts con la URL del backend desde vars/repo
      - name: Configure environment URL
        working-directory: ./frontend
        env:
          DOMAIN: ${{ vars.DOMAIN }}
          API_PREFIX: ${{ github.event.repository.name }}
          DES_KEY: ${{ secrets.DES_KEY }}
          ADAPTER_MODE: ${{ vars.ADAPTER_MODE || 'node' }}
        run: npm run set-env

      # 7. Generar build de Angular
      - name: Build Angular
        working-directory: ./frontend
        run: npm run build -- --base-href "/${{ github.event.repository.name }}/"

      # 8. Configurar fallback SPA para GitHub Pages
      - name: Configure GitHub Pages fallback
        run: cp ./frontend/dist/frontend/browser/index.html ./frontend/dist/frontend/browser/404.html

      # 9. Subir artefacto generado
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./frontend/dist/frontend/browser

  # Despliegue
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
